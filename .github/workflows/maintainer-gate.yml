name: Maintainer Merge Gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  pull-requests: read
  contents: read

jobs:
  verify-maintainer:
    name: Verify Maintainer Approval
    runs-on: ubuntu-latest
    steps:
      - name: Verify maintainer approval or authorship
        uses: actions/github-script@v7
        with:
          script: |
            const authorizedMaintainers = ['maiquelleonel'];
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('No pull request found in event context.');
              return;
            }

            const author = pr.user.login.toLowerCase();
            core.info(`Evaluating maintainer gate for PR #${pr.number} (author: ${author})`);

            if (authorizedMaintainers.map(m => m.toLowerCase()).includes(author)) {
              core.info(`PR authored by authorized maintainer (${author}). Maintainer gate PASSED.`);
              return;
            }

            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const hasMaintainerApproval = reviews.some((review) => {
              const reviewer = review.user.login.toLowerCase();
              return authorizedMaintainers.map(m => m.toLowerCase()).includes(reviewer) && review.state === 'APPROVED';
            });

            if (!hasMaintainerApproval) {
              core.setFailed(
                `PR requires approval from an authorized maintainer (${authorizedMaintainers.map(m => '@' + m).join(', ')}) before merging into main.`
              );
            } else {
              core.info('PR has been approved by an authorized maintainer. Maintainer gate PASSED.');
            }
