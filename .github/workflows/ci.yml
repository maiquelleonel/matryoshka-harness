name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "task/**"

permissions:
  contents: read

jobs:
  ci:
    name: Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security audit
        run: bun audit

      - name: Run build
        run: bun run build

      - name: Run tests
        run: bun test
