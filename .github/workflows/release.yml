name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Automated SemVer Release & NPM Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verification tests
        run: bun test

      - name: Run build
        run: bun run build

      - name: Build standalone native binaries
        run: bun run build:binaries

      - name: Build protective typosquatting shells
        run: bun run build:shells

      - name: Calculate SemVer and Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          bun run release

      - name: Attach standalone binary assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "dist/bin" ]; then
            RELEASE_TAG="${{ github.ref_name }}"
            if [[ "$RELEASE_TAG" != v* ]]; then
              RELEASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            fi
            if [ -n "$RELEASE_TAG" ]; then
              echo "Uploading standalone binaries and checksums to release $RELEASE_TAG..."
              gh release upload "$RELEASE_TAG" dist/bin/* --clobber || true
            fi
          fi

      - name: Setup Node for NPM publishing
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org/"

      - name: Synchronize package.json versions to release tag
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          if [[ "$RELEASE_TAG" != v* ]]; then
            RELEASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi
          VERSION="${RELEASE_TAG#v}"
          if [ -n "$VERSION" ]; then
            echo "Synchronizing package.json files to version $VERSION..."
            bun -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const ver = process.argv[1];
              const root = JSON.parse(fs.readFileSync("package.json", "utf8"));
              root.version = ver;
              fs.writeFileSync("package.json", JSON.stringify(root, null, 2) + "\n");
              if (fs.existsSync("packages")) {
                for (const dir of fs.readdirSync("packages")) {
                  const pkgPath = path.join("packages", dir, "package.json");
                  if (fs.existsSync(pkgPath)) {
                    const p = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
                    p.version = ver;
                    if (p.dependencies && p.dependencies["@maiquelleonel/matryoshka"]) {
                      p.dependencies["@maiquelleonel/matryoshka"] = "^" + ver;
                    }
                    fs.writeFileSync(pkgPath, JSON.stringify(p, null, 2) + "\n");
                  }
                }
              }
            ' "$VERSION"
          fi

      - name: Publish canonical package to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Remove standalone binaries from dist before packaging for NPM (they are already attached to GitHub Release)
          rm -rf dist/bin
          npm publish --access public

      - name: Publish protective typosquatting shells to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              echo "Publishing $dir to NPM registry..."
              (cd "$dir" && npm publish --access public) || true
            fi
          done
